spring.application.name=stationCamera
server.port=8082
spring.datasource.url=jdbc:mysql://localhost:3306/stationcamera
spring.datasource.username=root
spring.datasource.password=admin
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=update
spring.web.cors.allowed-origins=http://localhost:3000
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE
spring.web.cors.allowed-headers=*
#spring.web.cors.allow-credentials=true
logging.level.com.authentication=DEBUG
logging.level.org.springframework.security=DEBUG
aws.accessKeyId=${AWS_ACCESS_KEY}
aws.secretAccessKey=${AWS_SECRET_KEY}
aws.bucketName=${AWS_BUCKET_NAME}
#logging.level.root=warn